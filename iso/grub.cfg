# Scrappy worker autoinstall ISO — replaces /boot/grub/grub.cfg of the stock
# Ubuntu 24.04.5 live-server ISO. Used by both UEFI and legacy BIOS boot.
#
# Menu titles are plain ASCII on purpose: the BIOS text console cannot render
# Hungarian accents reliably.
#
# The autoinstall config is a nocloud seed in /scrappy/ (user-data +
# meta-data), referenced ONLY by the first two entries via ds=nocloud. There
# is deliberately no /autoinstall.yaml at the ISO root: subiquity 24.04 picks
# that up even without the autoinstall parameter, which would hijack the
# manual entry. `autoinstall` on the cmdline skips the confirmation prompt.
# In GRUB the ';' must be escaped.
#
# scrappy.mode= is read by /scrappy/pick-disk.sh (autoinstall early-command):
#   fresh     -> refuse a disk that already holds Linux (default entry, so a
#                pendrive left plugged in can never wipe a running worker);
#                empty and factory-Windows disks are installed onto
#   reinstall -> overwrite the internal disk regardless of its contents

set timeout=10
set default=0

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Scrappy worker - uj telepites (ures / Windowsos lemezre)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/scrappy/ scrappy.mode=fresh ---
	initrd	/casper/initrd
}
menuentry "Scrappy worker - UJRATELEPITES: FELULIRJA A MEGLEVO LINUXOT" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/scrappy/ scrappy.mode=reinstall ---
	initrd	/casper/initrd
}
menuentry "Ubuntu Server - kezi telepito (eredeti, autoinstall nelkul)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  ---
	initrd	/casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
fi
